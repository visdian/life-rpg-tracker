<script>



  
async function playPrecisionRepairSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const times = [0, 0.12, 0.24]; // 节奏稍微快一点点，显得更有干劲

    times.forEach((startTime, index) => {
        // 1. 创建金属敲击声部分 (Triangle Wave)
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1000 + (index * 100), audioCtx.currentTime + startTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + startTime + 0.1);

        // 2. 创建白噪声部分 (磨砂/白噪质感)
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // 3. 噪声滤波器 (让白噪听起来像金属摩擦而不是下雨)
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 3000; // 高频摩擦感

        const noiseGain = audioCtx.createGain();

        // 4. 设定音量包络
        oscGain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
        oscGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + startTime + 0.01);
        oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + startTime + 0.1);

        noiseGain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
        noiseGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + startTime + 0.01);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + startTime + 0.08);

        // 连接所有节点
        osc.connect(oscGain);
        noise.connect(filter);
        filter.connect(noiseGain);
        
        oscGain.connect(audioCtx.destination);
        noiseGain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + startTime);
        noise.start(audioCtx.currentTime + startTime);
        osc.stop(audioCtx.currentTime + startTime + 0.1);
        noise.stop(audioCtx.currentTime + startTime + 0.1);
    });
}
  

function playSawingSound() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // 创建一个白噪声生成器（模拟摩擦声）
    const bufferSize = audioCtx.sampleRate * 0.4; // 持续0.4秒
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1; // 生成随机噪声
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    // 创建滤波器，让声音听起来厚重一些（像木头而不是收音机杂音）
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, audioCtx.currentTime);

    const gainNode = audioCtx.createGain();

    // 模拟拉锯的动作：声音先大再小，带有一点节奏感
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1); // 压下去的声音
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); // 抬起来的声音

    noise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    noise.start();
    noise.stop(audioCtx.currentTime + 0.4);
}
  

// 生成一个圆润的“水滴/木琴”音效
function playClickSound() {
    // 创建音频上下文
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.type = 'sine'; // 正弦波，声音最圆润
    
    // 设定频率：从 800Hz 快速降到 400Hz，产生“砰”的圆润质感
    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);

    // 设定音量：快速淡出，避免刺耳
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.1);
}
