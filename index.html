<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFE RPG - Ocean of Self</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* 1. 全局颜色变量配置 */
        :root {
            --bg-color: #b7e1f5;
            --card-bg: rgba(255, 255, 255, 0.88);
            --primary: #20b2aa;
            --secondary: #38a3a5;
            --accent: #ffa500;
            --xp-color: #6c5ce7;
            --text-main: #323232;
            --text-sub: #636e72;
            --level-1: #c6e48b;
            --level-2: #7bc96f;
            --level-3: #239a3b;
            --level-4: #196127;
        }

        /* 2. 日历格子基础：精致虚线框 */
        .matrix-box { 
            aspect-ratio: 1; 
            width: 35px; 
            height: 35px; 
            background: transparent; 
            border: 1px dashed rgba(32, 178, 170, 0.4); 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: rgba(32, 178, 170, 0.6);
        }

        /* 3. 核心颜色关联 */
        .matrix-box.level-1 { 
            background-color: var(--level-1) !important; 
            border: 1px solid var(--level-1) !important; 
            color: white; 
        }
        .matrix-box.level-2 { 
            background-color: var(--level-2) !important; 
            border: 1px solid var(--level-2) !important; 
            color: white; 
        }
        .matrix-box.level-3 { 
            background-color: var(--level-3) !important; 
            border: 1px solid var(--level-3) !important; 
            color: white; 
        }
        .matrix-box.level-4 { 
            background-color: var(--level-4) !important; 
            border: 1px solid var(--level-4) !important; 
            color: white; 
            box-shadow: 0 0 10px rgba(255,165,0,0.3);
        }

        .matrix-box.is-today {
            border: 2px dashed var(--primary) !important;
            color: var(--primary);
            font-weight: bold;
        }

        .matrix-box.has-data {
            border-style: solid !important;
        }

        /* 核心动画 */
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
        @keyframes waveMove { 0% { transform: translateX(0) translateY(0); } 50% { transform: translateX(-40px) translateY(10px); } 100% { transform: translateX(0) translateY(0); } }
        @keyframes levelUpPop { 0% { transform: scale(1); } 50% { transform: scale(1.4); filter: brightness(1.2); } 100% { transform: scale(1); } }
        @keyframes repairWave { 0% { box-shadow: 0 0 0 0 rgba(255, 165, 0, 0.6); } 100% { box-shadow: 0 0 0 40px rgba(255, 165, 0, 0); } }
        @keyframes confetti { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, "Noto Sans SC", sans-serif;
            margin: 0; padding: 0; overflow-x: hidden;
            transition: background 1s ease;
        }

        .wave-container { position: fixed; top: 0; left: 0; width: 200%; height: 100%; z-index: -1; pointer-events: none; }
        .wave-line { position: absolute; width: 100%; height: 200px; border-top: 3px solid rgba(255, 255, 255, 0.4); border-radius: 40%; animation: waveMove 12s ease-in-out infinite; }
        .wave1 { top: 20%; animation-duration: 15s; opacity: 0.6; }
        .wave2 { top: 45%; animation-duration: 18s; opacity: 0.4; animation-delay: -2s; }
        .wave3 { top: 75%; animation-duration: 12s; opacity: 0.5; animation-delay: -5s; }

        .xp-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.25); z-index: 1000; }
        .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--xp-color), #a29bfe); box-shadow: 0 0 8px rgba(108, 92, 231, 0.4); transition: width 0.8s ease; }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 30px 20px 120px; box-sizing: border-box; }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .ship-status {
            background: var(--card-bg); padding: 30px 25px; border-radius: 35px;
            text-align: center; margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.7);
            position: relative;
        }

        .level-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--xp-color); color: white; padding: 5px 18px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
        .ship-icon { font-size: 4rem; margin-bottom: 10px; display: block; animation: float 5s ease-in-out infinite; transition: 0.3s; }
        .ship-level-up { animation: levelUpPop 0.8s cubic-bezier(0.17, 0.67, 0.83, 0.67) !important; }

        .hp-section { margin: 20px 0; text-align: left; }
        .hp-label { font-size: 0.65rem; font-weight: bold; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 6px; display: block; }
        .hp-bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.05); border-radius: 20px; overflow: hidden; border: 1.5px solid #fff; }
        .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #ff7675, #fab1a0); transition: 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
        .hp-healthy { background: linear-gradient(90deg, var(--primary), var(--secondary)); }

        .resource-row { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
        .resource-item { flex: 1; background: #fff; padding: 10px; border-radius: 16px; font-size: 0.9rem; font-weight: bold; border: 1px solid #f0f0f0; text-align: center;}

        .repair-group { display: flex; gap: 12px; }
        .btn-repair { flex: 1; padding: 12px 5px; border-radius: 15px; font-size: 0.72rem; font-weight: 800; cursor: pointer; transition: 0.3s; border: none; }
        .btn-with-wood { background: var(--primary); color: white; }
        .btn-with-money { background: white; color: var(--accent); border: 1.5px solid var(--accent); }
        .repair-flash { animation: repairWave 0.6s ease-out; }

        .quest-item { background: var(--card-bg); padding: 22px; border-radius: 28px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.6); }
        .btn-check { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 18px; font-weight: bold; cursor: pointer; }

        .matrix-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 35px); 
            gap: 8px; 
            justify-content: center; 
            margin: 0 auto;
        }

        .matrix-grid .matrix-box { 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
            position: relative !important;
        }

        .matrix-grid .matrix-box:hover { 
            transform: scale(1.3) translateY(-8px) !important; 
            z-index: 99 !important;
            border-style: solid !important;
            border-color: var(--primary) !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important;
        }

        .matrix-grid .matrix-box:active { transform: scale(1.2) translateY(-4px) !important; }

        .log-panel { 
            background: rgba(255,255,255,0.2); 
            padding: 18px; 
            border-radius: 22px; 
            margin-top: 30px;    
            margin-bottom: 20px; 
            border-left: 4px solid var(--primary); 
            backdrop-filter: blur(5px); 
        }
        
        .log-header { font-size: 0.7rem; color: var(--primary); font-weight: 800; letter-spacing: 1.5px; margin-bottom: 5px; }
        .log-content { font-size: 0.9rem; line-height: 1.5; color: var(--text-main); }

        .bottom-nav { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 280px; height: 65px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; border: 1px solid rgba(255,255,255,0.5); }
        .nav-item { font-size: 1.5rem; cursor: pointer; opacity: 0.3; transition: 0.3s; padding: 10px; }
        .nav-item.active { opacity: 1; transform: translateY(-5px); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1)); }

        .input-card { background: var(--card-bg); padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 0.7rem; color: var(--secondary); margin-bottom: 12px; font-weight: 800; letter-spacing: 2px; }

        input {
            width: 100%; padding: 16px 20px; background: rgba(255, 255, 255, 0.5); border: 1.5px solid #e1e8ed; border-radius: 20px; box-sizing: border-box; font-size: 1rem; color: var(--text-main); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 0.5px;
        }
        input:focus { outline: none; background: #fff; border-color: var(--primary); box-shadow: 0 8px 20px rgba(32, 178, 170, 0.15); transform: translateY(-2px); }
        input::placeholder { color: #b2bec3; font-size: 0.9rem; }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .log-animation-trigger { animation: slideUpFade 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        .calendar-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 50px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; background: rgba(249, 234, 244, 0.2); padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 15px; }
        #currentMonthLabel { font-weight: bold; font-size: 1.1rem; color: #ff8f00; letter-spacing: 1px; text-shadow: 0 0 10px rgba(222, 202, 40, 0.5); }
        .calendar-header span { font-size: 1.2rem; color: var(--secondary); padding: 5px 10px; transition: all 0.3s; user-select: none; cursor: pointer; }
        .calendar-header span:hover { color: #fff; transform: scale(1.3); text-shadow: 0 0 15px var(--secondary); }
    </style>
</head>
<body>

<div class="wave-container">
    <div class="wave-line wave1"></div>
    <div class="wave-line wave2"></div>
    <div class="wave-line wave3"></div>
</div>

<div class="xp-container"><div id="xpFill" class="xp-fill"></div></div>

<div class="container">
    <div id="homePage" class="page active">
        <div class="ship-status" id="shipCard">
            <div class="level-badge" id="levelLabel">见习船员</div>
            <span class="ship-icon" id="shipVisual">🛶</span>
            <div id="rankDisplay" style="font-size: 0.8rem; color: var(--text-sub); font-weight: bold;">里程: Lv.0</div>
            
            <div class="hp-section">
                <span class="hp-label">HULL INTEGRITY / 船体健康度</span>
                <div class="hp-bar-bg"><div id="hpFill" class="hp-bar-fill hp-healthy"></div></div>
                <div style="font-size: 0.7rem; color: var(--text-sub); margin-top: 6px; text-align: right;">
                    下一海域进度: <span id="xpText">0%</span>
                </div>
            </div>

            <div class="resource-row">
                <div class="resource-item">💰 ¥ <span id="balanceDisplay">0</span></div>
                <div class="resource-item">🪵 木板 x <span id="woodDisplay">0</span></div>
            </div>

            <div class="repair-group">
                <button class="btn-repair btn-with-wood" onclick="repairWithWood()">消耗材料加固<br><span style="font-weight:normal; font-size:0.6rem">1木板 (回复10HP)</span></button>
                <button class="btn-repair btn-with-money" onclick="repairWithMoney()">紧急重修木筏<br><span style="font-weight:normal; font-size:0.6rem">500¥ (回复30HP)</span></button>
            </div>
        </div>

        <div id="habitList"></div>

        <div class="log-panel">
            <div class="log-header">NAVIGATION LOG</div>
            <div id="latestLog" class="log-content">海面波光粼粼，木筏平稳前行。</div>
        </div>
    </div>

    <div id="addPage" class="page">
        <div class="input-card">
            <h2 style="color: var(--primary); margin-bottom: 25px; font-weight: 800;">登记新习惯</h2>
            <div class="input-group">
                <label>HABIT NAME / 习惯名称</label>
                <input type="text" id="habitName" placeholder="例如：背单词、晨跑、冥想...">
            </div>
            <div class="input-group">
                <label>GOLD REWARD / 金币奖励 (¥)</label>
                <input type="number" id="habitReward" placeholder="完成一次可获得的金币数">
            </div>
            <button class="btn-check" style="width: 100%; margin-top: 20px;" onclick="saveAndReturn()">扬帆启航 (添加)</button>
        </div>
    </div>

    <div id="calendarPage" class="page">
        <div style="margin-bottom: 25px; padding-left: 10px;">
            <h2 style="color: var(--secondary); margin-bottom: 5px;">航行轨迹</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin: 0;">点击方块回顾那一天的航程</p>
        </div>

        <div class="matrix-card">
            <div class="calendar-header">
                <span onclick="window.changeMonth(-1)">◀</span>
                <span id="currentMonthLabel">2026年 5月</span>
                <span onclick="window.changeMonth(1)">▶</span>
            </div>
            <div class="matrix-grid" id="matrixGrid"></div>
        </div>

        <div class="log-panel">
            <div class="log-header">VOYAGE HISTORY</div>
            <div id="selectedDateLog" class="log-content">选择一个日期来查看记录...</div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="navigate('homePage', this)">🌊</div>
    <div class="nav-item" onclick="navigate('addPage', this)">➕</div>
    <div class="nav-item" onclick="navigate('calendarPage', this)">🗺️</div>
</div>

<script>
    // --- 1. 音效系统 ---
    async function playPrecisionRepairSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        const times = [0, 0.12, 0.24];
        times.forEach((startTime, index) => {
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1000 + (index * 100), audioCtx.currentTime + startTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + startTime + 0.1);

            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 3000;
            const noiseGain = audioCtx.createGain();

            oscGain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
            oscGain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + startTime + 0.01);
            oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + startTime + 0.1);

            noiseGain.gain.setValueAtTime(0, audioCtx.currentTime + startTime);
            noiseGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + startTime + 0.01);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + startTime + 0.08);

            osc.connect(oscGain); noise.connect(filter); filter.connect(noiseGain);
            oscGain.connect(audioCtx.destination); noiseGain.connect(audioCtx.destination);

            osc.start(audioCtx.currentTime + startTime); noise.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + 0.1); noise.stop(audioCtx.currentTime + startTime + 0.1);
        });
    }

    function playSawingSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        noise.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
        noise.start(); noise.stop(audioCtx.currentTime + 0.4);
    }

    function playClickSound() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
        oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.1);
    }

    // --- 2. 数据与页面控制模型 ---
    let userData = JSON.parse(localStorage.getItem('lifeRpgOceanFinal_V6')) || {
        balance: 0, totalEarned: 0, wood: 0, hp: 100, level: 0,
        logs: ["木筏离开了港口，开启了这场修行。"],
        habits: [
            { name: "12点前睡", reward: 1000, count: 0 },
            { name: "学日语", reward: 500, count: 0 }
        ],
        history: {} 
    };

    window.displayDate = new Date();

    function navigate(p, el) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(ni => ni.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        if(el) el.classList.add('active');
        if(p === 'calendarPage') renderMatrix(); 
        window.scrollTo(0,0);
    }

    // --- 3. 核心界面渲染系统 ---
    function render() {
        const currentXp = userData.totalEarned % 5000;
        const xpPercent = (currentXp / 5000) * 100;
        document.getElementById('xpFill').style.width = xpPercent + '%';
        document.getElementById('xpText').innerText = Math.floor(xpPercent) + '%';
        
        document.getElementById('levelLabel').innerText = getRanks(userData.level);
        document.getElementById('rankDisplay').innerText = `里程: Lv.${userData.level}`;
        
        const hpBar = document.getElementById('hpFill');
        hpBar.style.width = userData.hp + '%';
        hpBar.className = userData.hp < 40 ? 'hp-bar-fill' : 'hp-bar-fill hp-healthy';
        
        document.getElementById('balanceDisplay').innerText = userData.balance;
        document.getElementById('woodDisplay').innerText = userData.wood;
        document.getElementById('latestLog').innerText = userData.logs[0] || "暂无日志";
        document.getElementById('shipVisual').innerText = userData.hp < 30 ? "🏚️" : "🛶";

        const list = document.getElementById('habitList');
        list.innerHTML = '';
        userData.habits.forEach((h, index) => {
            const item = document.createElement('div');
            item.className = 'quest-item';
            item.innerHTML = `
                <div style="flex:1">
                    <strong style="font-size:1.1rem; display:block;">${h.name}</strong>
                    <div style="font-size:0.75rem; color:var(--secondary); margin-top:4px;">收益: ¥${h.reward} | 已打卡: ${h.count || 0}次</div>
                </div>
                <button class="btn-check" onclick="checkHabit(${index})">打卡</button>
            `;
            list.appendChild(item);
        });
    }

    // --- 4. 业务交互逻辑 ---
    function checkHabit(index) {
        playClickSound(); 
        const h = userData.habits[index];
        h.count = (h.count || 0) + 1;
        userData.balance += parseInt(h.reward);
        userData.totalEarned += parseInt(h.reward);
        
        const today = new Date().toISOString().split('T')[0];
        userData.history[today] = (userData.history[today] || 0) + parseInt(h.reward);

        let msg = `【打卡成功】完成了 ${h.name}，增加了 ¥${h.reward} 航海资源。`;
        if (Math.random() < 0.4) {
            userData.wood += 1;
            msg += " 顺便在海面上捡到了碎木板！🪵";
        }
        
        userData.logs.unshift(msg);
        if(userData.logs.length > 5) userData.logs.pop();
        checkLevelUp(); saveData(); render();
    }

    function renderMatrix() {
        const grid = document.getElementById('matrixGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        const year = window.displayDate.getFullYear();
        const month = window.displayDate.getMonth();
        
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

        document.getElementById('currentMonthLabel').innerText = `${year}年 ${month + 1}月`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        for(let i=0; i<startOffset; i++) {
            grid.innerHTML += '<div></div>';
        }

        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const goldEarned = userData.history[dateStr] || 0;
            
            let levelClass = '';
            if(goldEarned > 0) {
                levelClass = 'has-data ';
                if(goldEarned <= 500) levelClass += 'level-1';
                else if(goldEarned > 500 && goldEarned <= 1500) levelClass += 'level-2';
                else if(goldEarned > 1500 && goldEarned <= 3000) levelClass += 'level-3';
                else if(goldEarned > 3000) levelClass += 'level-4';
            }

            if(dateStr === todayStr) levelClass += ' is-today';

            const box = document.createElement('div');
            box.className = `matrix-box ${levelClass}`;
            box.innerText = d;
            
            box.onclick = () => {
                const log = document.getElementById('selectedDateLog');
                const logPanel = log.parentElement;

                logPanel.classList.remove('log-animation-trigger');
                void logPanel.offsetWidth; 
                logPanel.classList.add('log-animation-trigger');

                if(goldEarned > 0) {
                    log.innerHTML = `<div style="color:var(--primary);font-weight:bold;margin-bottom:5px;">${dateStr} 航行日志</div><div style="font-size:0.85rem">· 当天通过坚毅自律共赚取航海金币：¥${goldEarned}。</div>`;
                } else {
                    log.innerHTML = `<div style="color:var(--text-sub)">${dateStr}</div><div style="font-size:0.85rem">该日期暂无航行记录。</div>`;
                }
            };
            grid.appendChild(box);
        }
    }

    window.changeMonth = function(step) {
        window.displayDate.setMonth(window.displayDate.getMonth() + step);
        renderMatrix();
        playClickSound();
    };

    function checkLevelUp() {
        const nextLv = Math.floor(userData.totalEarned / 5000);
        if (nextLv > userData.level) {
            userData.level = nextLv;
            triggerConfetti();
            const ship = document.getElementById('shipVisual');
            ship.classList.add('ship-level-up');
            setTimeout(() => ship.classList.remove('ship-level-up'), 1000);
            userData.logs.unshift(`🎉 晋升！你现在是 Lv.${userData.level} 的高级船长了！`);
        }
    }

    function getRanks(lv) {
        const ranks = ["见习船员", "初级水手", "资深舵手", "海域探险家", "木筏大师", "无畏船长"];
        return ranks[Math.min(lv, ranks.length - 1)];
    }

    function triggerConfetti() {
        for (let i = 0; i < 40; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + 'vw';
            piece.style.backgroundColor = ['#6c5ce7', '#fab1a0', '#55efc4', '#fdcb6e'][Math.floor(Math.random()*4)];
            piece.style.animationDelay = Math.random() * 0.5 + 's';
            document.body.appendChild(piece);
            setTimeout(() => piece.remove(), 2500);
        }
    }

    function repairWithWood() {
        if (userData.wood > 0 && userData.hp < 100) {
            playSawingSound();
            setTimeout(() => { playSawingSound(); }, 450);

            userData.wood--;
            userData.hp = Math.min(100, userData.hp + 10);
            userData.logs.unshift("🔧 使用了木材修理船只，船体结构得到了部分恢复。");
            saveData(); render();
        } else { alert("木材材料不足！"); }
    }

    async function repairWithMoney() {
        if (userData.balance >= 500 && userData.hp < 100) {
            try { await playPrecisionRepairSound(); } catch (e) { console.log(e); }
            userData.balance -= 500;
            userData.hp = Math.min(100, userData.hp + 30);
            userData.logs.unshift("🔧 【紧急修理】完成！支付500¥，紧急重修了部分受损舱室。");
            saveData(); render();
        } else if (userData.hp >= 100) {
            alert("船只非常坚固，不需要修理。");
        } else {
            alert("金币不足以支付维修费！");
        }
    }

    function saveAndReturn() {
        const name = document.getElementById('habitName').value.trim();
        const reward = document.getElementById('habitReward').value;
        if (name && reward) {
            userData.habits.push({ name, reward: parseInt(reward), count: 0 });
            userData.logs.unshift(`【新航线】成功登记了新习惯「${name}」！`);
            document.getElementById('habitName').value = '';
            document.getElementById('habitReward').value = '';
            saveData(); render(); navigate('homePage', document.querySelector('.bottom-nav .nav-item'));
        } else { alert("请填写完整的名称和奖励金币！"); }
    }

    function saveData() { 
        localStorage.setItem('lifeRpgOceanFinal_V6', JSON.stringify(userData)); 
        if (typeof window.syncToCloud === 'function') {
            window.syncToCloud();
        }
    }

    // 初始化生命周期
    if(Math.random() > 0.7) { userData.hp = Math.max(5, userData.hp - 5); saveData(); }
    render();
</script>
